ation" data-source="head" data-target="large_q" d="M285,790 L370,790" marker-end="url(#advanced-arrow-energie)"><title>Le reste ne disparaît pas</title></path><path class="advanced-edge limited" data-edge-kind="obstruction" data-source="generic_sieve" data-target="large_q" d="M815,620 L815,720 L490,720 L490,735" marker-end="url(#advanced-arrow-energie)"><title>Exiger une propriété spécifique de μ(q) et B</title></path><path class="advanced-edge limited" data-edge-kind="insuffisant" data-source="threequarters" data-target="J_bound" d="M490,1120 L490,1135 L815,1135 L815,1230" marker-end="url(#advanced-arrow-energie)"><title>Exposant 5/2 encore au-dessus de 2</title></path><path class="advanced-edge open" data-edge-kind="conditionnel" data-source="copies" data-target="@amplification" d="M165,620 L165,635 L355,635 L355,905 L490,905 L490,920" marker-end="url(#advanced-arrow-energie)"><title>Restitution ET tête ET grande queue ; ET : copies, head, large_q</title></path><path class="advanced-edge open" data-edge-kind="conditionnel" data-source="head" data-target="@amplification" d="M165,845 L165,860 L490,860 L490,920" marker-end="url(#advanced-arrow-energie)"><title>Restitution ET tête ET grande queue ; ET : copies, head, large_q</title></path><path class="advanced-edge open" data-edge-kind="conditionnel" data-source="large_q" data-target="@amplification" d="M490,845 L490,920" marker-end="url(#advanced-arrow-energie)"><title>Restitution ET tête ET grande queue ; ET : copies, head, large_q</title></path><path class="advanced-edge open" data-edge-kind="conditionnel" data-source="@amplification" data-target="threequarters" d="M490,958 L490,1010" marker-end="url(#advanced-arrow-energie)"><title>Restitution ET tête ET grande queue ; ET : copies, head, large_q</title></path><g class="advanced-node classique" id="map-energie-IDE-054" data-map-node="identity"><a data-node="identity" href="../00_Carte_des_idees.html#node=IDE-054" aria-label="IDE-054 · Identité des vrais coefficients"><rect class="node-bg" x="45" y="75" width="240" height="110" rx="6"/><text class="map-uid" x="59" y="96">IDE-054</text><text class="map-node-title" x="59" y="121">Identité des poids</text><text class="map-node-title" x="59" y="140">premiers</text><text class="map-node-status" x="59" y="171">Critère / résultat classique</text><title>Σ_{d|n} Λ(d) = log n caractérise les poids arithmétiques ; elle ne donne pas, seule, une borne globale.</title></a><a class="map-pdf" data-pdf="identity" href="../1_Presentation/CORRELATIONS_IDENTITE_ET_ENERGIE.pdf" aria-label="PDF : Identité des vrais coefficients"><rect x="236" y="83" width="38" height="21" rx="3"/><text x="255" y="98" text-anchor="middle">PDF</text><title>1_Presentation/CORRELATIONS_IDENTITE_ET_ENERGIE.pdf</title></a></g><g class="advanced-node demontre" id="map-energie-IDE-055" data-map-node="anchoring"><a data-node="anchoring" href="../00_Carte_des_idees.html#node=IDE-055" aria-label="IDE-055 · Corrélations ancrées"><rect class="node-bg" x="695" y="75" width="240" height="110" rx="6"/><text class="map-uid" x="709" y="96">IDE-055</text><text class="map-node-title" x="709" y="121">Corrélations ancrées</text><text class="map-node-status" x="709" y="171">Démontré dans le dossier</text><title>Les positions absolues et toutes les coupures sont conservées ; l’autocorrélation par écarts seule ne fixe pas le signe.</title></a><a class="map-pdf" data-pdf="anchoring" href="../1_Presentation/CORRELATIONS_IDENTITE_ET_ENERGIE.pdf" aria-label="PDF : Corrélations ancrées"><rect x="886" y="83" width="38" height="21" rx="3"/><text x="905" y="98" text-anchor="middle">PDF</text><title>1_Presentation/CORRELATIONS_IDENTITE_ET_ENERGIE.pdf</title></a></g><g class="advanced-node classique" id="map-energie-IDE-056" data-map-node="J"><a data-node="J" href="../00_Carte_des_idees.html#node=IDE-056" aria-label="IDE-056 · Énergie J"><rect class="node-bg" x="370" y="295" width="240" height="110" rx="6"/><text class="map-uid" x="384" y="316">IDE-056</text><text class="map-node-title" x="384" y="341">Énergie positive J</text><text class="map-node-status" x="384" y="391">Critère / résultat classique</text><title>J(X) = ∫₁ˣ (ψ(x)−x)² dx est positive ; c’est sa croissance qui doit être bornée.</title></a><a class="map-pdf" data-pdf="J" href="../1_Presentation/CORRELATIONS_IDENTITE_ET_ENERGIE.pdf" aria-label="PDF : Énergie J"><rect x="561" y="303" width="38" height="21" rx="3"/><text x="580" y="318" text-anchor="middle">PDF</text><title>1_Presentation/CORRELATIONS_IDENTITE_ET_ENERGIE.pdf</title></a></g><g class="advanced-node demontre" id="map-energie-IDE-059" data-map-node="copies"><a data-node="copies" href="../00_Carte_des_idees.html#node=IDE-059" aria-label="IDE-059 · Restitution et dilatations"><rect class="node-bg" x="45" y="510" width="240" height="110" rx="6"/><text class="map-uid" x="59" y="531">IDE-059</text><text class="map-node-title" x="59" y="556">Restitution et</text><text class="map-node-title" x="59" y="575">dilatations</text><text class="map-node-status" x="59" y="606">Démontré dans le dossier</text><title>A_o(x) = F_{p²}(x) − F_{p²}(x/p), p premier impair ; stabilité exacte, sans borne globale déduite.</title></a><a class="map-pdf" data-pdf="copies" href="../1_Presentation/ESSAI_AMPLIFICATION_ARITHMETIQUE_V6_55.pdf" aria-label="PDF : Restitution et dilatations"><rect x="236" y="518" width="38" height="21" rx="3"/><text x="255" y="533" text-anchor="middle">PDF</text><title>1_Presentation/ESSAI_AMPLIFICATION_ARITHMETIQUE_V6_55.pdf</title></a></g><g class="advanced-node obstacle" id="map-energie-IDE-063" data-map-node="generic_sieve"><a data-node="generic_sieve" href="../00_Carte_des_idees.html#node=IDE-063" aria-label="IDE-063 · Crible générique : perte des copies"><rect class="node-bg" x="695" y="510" width="240" height="110" rx="6"/><text class="map-uid" x="709" y="531">IDE-063</text><text class="map-node-title" x="709" y="556">Limite du crible</text><text class="map-node-title" x="709" y="575">générique</text><text class="map-node-status" x="709" y="606">Obstruction circonscrite</text><title>Réintroduire les paramètres carrés coûte D√H. Cela invalide l’amélioration générique, pas une estimation spécifique des vrais poids.</title></a><a class="map-pdf" data-pdf="generic_sieve" href="../1_Presentation/ESSAI_AMPLIFICATION_ARITHMETIQUE_V6_55.pdf" aria-label="PDF : Crible générique : perte des copies"><rect x="886" y="518" width="38" height="21" rx="3"/><text x="905" y="533" text-anchor="middle">PDF</text><title>1_Presentation/ESSAI_AMPLIFICATION_ARITHMETIQUE_V6_55.pdf</title></a></g><g class="advanced-node demontre" id="map-energie-IDE-060" data-map-node="head"><a data-node="head" href="../00_Carte_des_idees.html#node=IDE-060" aria-label="IDE-060 · Diagonale et petits conducteurs"><rect class="node-bg" x="45" y="735" width="240" height="110" rx="6"/><text class="map-uid" x="59" y="756">IDE-060</text><text class="map-node-title" x="59" y="781">Petits conducteurs :</text><text class="map-node-title" x="59" y="800">tête</text><text class="map-node-status" x="59" y="831">Démontré dans le dossier</text><title>Borne explicite de toute la tête q ≤ H, valable à toutes les échelles sous les paramètres déclarés.</title></a><a class="map-pdf" data-pdf="head" href="../1_Presentation/ESSAI_AMPLIFICATION_ARITHMETIQUE_V6_55.pdf" aria-label="PDF : Diagonale et petits conducteurs"><rect x="236" y="743" width="38" height="21" rx="3"/><text x="255" y="758" text-anchor="middle">PDF</text><title>1_Presentation/ESSAI_AMPLIFICATION_ARITHMETIQUE_V6_55.pdf</title></a></g><g class="advanced-node ouvert" id="map-energie-IDE-061" data-map-node="large_q"><a data-node="large_q" href="../00_Carte_des_idees.html#node=IDE-061" aria-label="IDE-061 · Grands conducteurs signés"><rect class="node-bg" x="370" y="735" width="240" height="110" rx="6"/><text class="map-uid" x="384" y="756">IDE-061</text><text class="map-node-title" x="384" y="781">Grands conducteurs</text><text class="map-node-title" x="384" y="800">signés</text><text class="map-node-status" x="384" y="831">Obligation ouverte</text><title>À H=X : obtenir R_{q&gt;X} ≤ C X³(1+log X)^k, en conservant μ(q) et les poids B.</title></a><a class="map-pdf" data-pdf="large_q" href="../1_Presentation/ESSAI_AMPLIFICATION_ARITHMETIQUE_V6_55.pdf" aria-label="PDF : Grands conducteurs signés"><rect x="561" y="743" width="38" height="21" rx="3"/><text x="580" y="758" text-anchor="middle">PDF</text><title>1_Presentation/ESSAI_AMPLIFICATION_ARITHMETIQUE_V6_55.pdf</title></a></g><g class="advanced-node conditionnel" id="map-energie-IDE-062" data-map-node="threequarters"><a data-node="threequarters" href="../00_Carte_des_idees.html#node=IDE-062" aria-label="IDE-062 · Étape conditionnelle : 3/4"><rect class="node-bg" x="370" y="1010" width="240" height="110" rx="6"/><text class="map-uid" x="384" y="1031">IDE-062</text><text class="map-node-title" x="384" y="1056">Conséquence visée :</text><text class="map-node-title" x="384" y="1075">Re(s)&gt;3/4</text><text class="map-node-status" x="384" y="1106">Conséquence conditionnelle</text><title>Restitution + tête + borne de grande queue donneraient J ≪ X^{5/2} polylog, donc aucun zéro pour Re(s)&gt;3/4. Non obtenu.</title></a><a class="map-pdf" data-pdf="threequarters" href="../1_Presentation/ESSAI_AMPLIFICATION_ARITHMETIQUE_V6_55.pdf" aria-label="PDF : Étape conditionnelle : 3/4"><rect x="561" y="1018" width="38" height="21" rx="3"/><text x="580" y="1033" text-anchor="middle">PDF</text><title>1_Presentation/ESSAI_AMPLIFICATION_ARITHMETIQUE_V6_55.pdf</title></a></g><g class="advanced-node demontre" id="map-energie-IDE-002" data-map-node="thA"><a data-node="thA" href="../00_Carte_des_idees.html#node=IDE-002" aria-label="IDE-002 · Théorème A"><rect class="node-bg" x="45" y="1010" width="240" height="110" rx="6"/><text class="map-uid" x="59" y="1031">IDE-002</text><text class="map-node-title" x="59" y="1056">Théorème A : critère</text><text class="map-node-title" x="59" y="1075">pour Q</text><text class="map-node-status" x="59" y="1106">Démontré dans le dossier</text><title>Critère de croissance de Q conservé ; la borne suffisante depuis les premiers reste ouverte.</title></a><a class="map-pdf" data-pdf="thA" href="../1_Presentation/37_PRE_RELECTURE_A_B_ARCHIPEL.pdf" aria-label="PDF : Théorème A"><rect x="236" y="1018" width="38" height="21" rx="3"/><text x="255" y="1033" text-anchor="middle">PDF</text><title>1_Presentation/37_PRE_RELECTURE_A_B_ARCHIPEL.pdf</title></a></g><g class="advanced-node ouvert" id="map-energie-IDE-058" data-map-node="Q_bound"><a data-node="Q_bound" href="../00_Carte_des_idees.html#node=IDE-058" aria-label="IDE-058 · Borne de l’énergie initiale Q"><rect class="node-bg" x="45" y="1230" width="240" height="110" rx="6"/><text class="map-uid" x="59" y="1251">IDE-058</text><text class="map-node-title" x="59" y="1276">Borne globale de Q</text><text class="map-node-status" x="59" y="1326">Obligation ouverte</text><title>Q(X) = X^{o(1)} depuis les premiers reste ouverte ; le théorème A en fait une autre porte vers RH.</title></a><a class="map-pdf" data-pdf="Q_bound" href="../1_Presentation/37_PRE_RELECTURE_A_B_ARCHIPEL.pdf" aria-label="PDF : Borne de l’énergie initiale Q"><rect x="236" y="1238" width="38" height="21" rx="3"/><text x="255" y="1253" text-anchor="middle">PDF</text><title>1_Presentation/37_PRE_RELECTURE_A_B_ARCHIPEL.pdf</title></a></g><g class="advanced-node ouvert" id="map-energie-IDE-057" data-map-node="J_bound"><a data-node="J_bound" href="../00_Carte_des_idees.html#node=IDE-057" aria-label="IDE-057 · Borne de force RH"><rect class="node-bg" x="695" y="1230" width="240" height="110" rx="6"/><text class="map-uid" x="709" y="1251">IDE-057</text><text class="map-node-title" x="709" y="1276">Borne J(X) = O(X²)</text><text class="map-node-status" x="709" y="1326">Obligation ouverte</text><title>J(X) = O(X²), pour les vrais coefficients Λ et toutes les échelles : ouverte.</title></a><a class="map-pdf" data-pdf="J_bound" href="../1_Presentation/CORRELATIONS_IDENTITE_ET_ENERGIE.pdf" aria-label="PDF : Borne de force RH"><rect x="886" y="1238" width="38" height="21" rx="3"/><text x="905" y="1253" text-anchor="middle">PDF</text><title>1_Presentation/CORRELATIONS_IDENTITE_ET_ENERGIE.pdf</title></a></g><g class="advanced-node ouvert" id="map-energie-IDE-053" data-map-node="RH"><a data-node="RH" href="../00_Carte_des_idees.html#node=IDE-053" aria-label="IDE-053 · Hypothèse de Riemann"><rect class="node-bg" x="370" y="1450" width="240" height="110" rx="6"/><text class="map-uid" x="384" y="1471">IDE-053</text><text class="map-node-title" x="384" y="1496">Hypothèse de Riemann</text><text class="map-node-status" x="384" y="1546">Obligation ouverte</text><title>But inchangé : tous les zéros non triviaux sur Re(s)=1/2. Non démontré.</title></a><a class="map-pdf" data-pdf="RH" href="../1_Presentation/76_RECONSTRUIRE_LA_PISTE_GLOBALE_DE_WEIL.pdf" aria-label="PDF : Hypothèse de Riemann"><rect x="561" y="1458" width="38" height="21" rx="3"/><text x="580" y="1473" text-anchor="middle">PDF</text><title>1_Presentation/76_RECONSTRUIRE_LA_PISTE_GLOBALE_DE_WEIL.pdf</title></a></g><g class="and-gate" data-and-guard="copies head large_q"><rect x="458" y="920" width="64" height="38" rx="19"/><text x="490" y="945" text-anchor="middle">ET</text><title>Restitution ET tête ET grande queue</title></g></svg>