g{fill:var(--neg-bg,#f8e9e6);stroke:var(--neg,#a6392e)}.advanced-svg .map-uid{font:11px ui-monospace,monospace;fill:var(--ink2,#4c5868)}.advanced-svg .map-node-title{font:600 16px var(--serif,Georgia,serif)}.advanced-svg .map-node-status{font:11px var(--sans,system-ui,sans-serif);fill:var(--ink2,#4c5868)}.advanced-node>a:first-child{cursor:pointer}.advanced-node>a:first-child:hover .node-bg{stroke-width:2.8}.map-pdf rect{fill:var(--map-sheet);stroke:var(--map-rule)}.advanced-svg .map-pdf text{font:600 11px system-ui;fill:var(--lit,#3b4a9b)}.advanced-edge{fill:none;stroke-width:1.65;stroke-linejoin:round;stroke-linecap:round;stroke:var(--ink2,#4c5868)}.advanced-edge.open{stroke:var(--cond,#b26a00);stroke-dasharray:7 5}.advanced-edge.limited{stroke:var(--neg,#a6392e);stroke-dasharray:2 5}.and-gate rect{fill:var(--map-sheet);stroke:var(--cond,#b26a00);stroke-width:1.8}.and-gate text{font:700 15px system-ui}.advanced-foot{font-size:.8rem;color:var(--ink2,var(--muted))}.advanced-panel[hidden]{display:none!important}@media(max-width:640px){.advanced-viewport{max-height:68vh}.advanced-tools{gap:8px}.advanced-tabs button{font-size:.78rem;padding:7px}.advanced-tabs{gap:6px}}@media print{.advanced-tools,.advanced-tabs{display:none}.advanced-panel[hidden]{display:block!important}.advanced-viewport{max-height:none;overflow:visible}.advanced-svg{width:100%!important;max-width:100%!important}.advanced-panel{break-inside:avoid}}
</style><text x="45" y="35" class="map-heading">Ponts, témoins et voies limitées</text><path class="advanced-edge limited" data-edge-kind="insuffisant" data-source="v13" data-target="global_sign" d="M490,620 L490,1010" marker-end="url(#advanced-arrow-ponts)"><title>Un pli choisi ne donne pas le signe global</title></path><path class="advanced-edge open" data-edge-kind="obligation" data-source="schur" data-target="global_sign" d="M815,845 L815,995 L490,995 L490,1010" marker-end="url(#advanced-arrow-ponts)"><title>Contrôler les couplages de la famille choisie</title></path><path class="advanced-edge limited" data-edge-kind="obstruction" data-source="surface" data-target="stepanov" d="M165,185 L165,295" marker-end="url(#advanced-arrow-ponts)"><title>La transplantation directe étudiée est insuffisante</title></path><path class="advanced-edge known" data-edge-kind="reouverture" data-source="stepanov" data-target="jets" d="M285,350 L370,350" marker-end="url(#advanced-arrow-ponts)"><title>Des conditions de réouverture exigent des objets définis</title></path><path class="advanced-edge known" data-edge-kind="construction" data-source="jets" data-target="v13" d="M490,405 L490,510" marker-end="url(#advanced-arrow-ponts)"><title>Rang, contraintes exactes, fibres et plis</title></path><path class="advanced-edge known" data-edge-kind="temoin" data-source="dh_cert" data-target="global_sign" d="M815,620 L815,635 L625,635 L625,995 L490,995 L490,1010" marker-end="url(#advanced-arrow-ponts)"><title>Tester les arguments qui prétendent imposer le signe</title></path><path class="advanced-edge known" data-edge-kind="relation" data-source="rencontre_n" data-target="schur" d="M815,185 L815,200 L680,200 L680,720 L815,720 L815,735" marker-end="url(#advanced-arrow-ponts)"><title>Les interactions motivent un contrôle des couplages</title></path><path class="advanced-edge limited" data-edge-kind="obstruction" data-source="prime_norm" data-target="domaines" d="M165,620 L165,735" marker-end="url(#advanced-arrow-ponts)"><title>Contrôler la forme complète dans le domaine requis</title></path><path class="advanced-edge limited" data-edge-kind="obstruction" data-source="prime_norm" data-target="schur" d="M165,620 L165,720 L815,720 L815,735" marker-end="url(#advanced-arrow-ponts)"><title>Ne pas payer le couplage par une norme divergente</title></path><g class="advanced-node partiel" id="map-ponts-IDE-064" data-map-node="surface"><a data-node="surface" href="../00_Carte_des_idees.html#node=IDE-064" aria-label="IDE-064 · Surface et Frobenius virtuels"><rect class="node-bg" x="45" y="75" width="240" height="110" rx="6"/><text class="map-uid" x="59" y="96">IDE-064</text><text class="map-node-title" x="59" y="121">Surface et Frobenius</text><text class="map-node-title" x="59" y="140">virtuels</text><text class="map-node-status" x="59" y="171">Acquis partiel</text><title>Des signatures sont construites ; aucun objet géométrique imposant le signe pour ζ n’est obtenu.</title></a><a class="map-pdf" data-pdf="surface" href="../1_Presentation/46_LA_SURFACE_VIRTUELLE.pdf" aria-label="PDF : Surface et Frobenius virtuels"><rect x="236" y="83" width="38" height="21" rx="3"/><text x="255" y="98" text-anchor="middle">PDF</text><title>1_Presentation/46_LA_SURFACE_VIRTUELLE.pdf</title></a></g><g class="advanced-node mesure" id="map-ponts-IDE-068" data-map-node="rencontre_n"><a data-node="rencontre_n" href="../00_Carte_des_idees.html#node=IDE-068" aria-label="IDE-068 · La Rencontre à n"><rect class="node-bg" x="695" y="75" width="240" height="110" rx="6"/><text class="map-uid" x="709" y="96">IDE-068</text><text class="map-node-title" x="709" y="121">Interactions :</text><text class="map-node-title" x="709" y="140">Rencontre à n</text><text class="map-node-status" x="709" y="171">Mesuré dans le cadre déclaré</text><title>La marge et les paires restent des objets d’étude ; leur statistique ne remplace pas une loi arithmétique universelle.</title></a><a class="map-pdf" data-pdf="rencontre_n" href="../1_Presentation/43_PLAN_DE_RECHERCHE_LA_RENCONTRE_A_N.pdf" aria-label="PDF : La Rencontre à n"><rect x="886" y="83" width="38" height="21" rx="3"/><text x="905" y="98" text-anchor="middle">PDF</text><title>1_Presentation/43_PLAN_DE_RECHERCHE_LA_RENCONTRE_A_N.pdf</title></a></g><g class="advanced-node obstacle" id="map-ponts-IDE-065" data-map-node="stepanov"><a data-node="stepanov" href="../00_Carte_des_idees.html#node=IDE-065" aria-label="IDE-065 · Transplantation directe de Stepanov"><rect class="node-bg" x="45" y="295" width="240" height="110" rx="6"/><text class="map-uid" x="59" y="316">IDE-065</text><text class="map-node-title" x="59" y="341">Transplantation de</text><text class="map-node-title" x="59" y="360">Stepanov</text><text class="map-node-status" x="59" y="391">Obstruction circonscrite</text><title>Le modèle d’échelle étudié échoue. Réouverture seulement avec une dérivation et un espace de fonctions adéquats explicitement construits.</title></a><a class="map-pdf" data-pdf="stepanov" href="../1_Presentation/51_J3B_LE_FROBENIUS_DE_CARACTERISTIQUE_UN.pdf" aria-label="PDF : Transplantation directe de Stepanov"><rect x="236" y="303" width="38" height="21" rx="3"/><text x="255" y="318" text-anchor="middle">PDF</text><title>1_Presentation/51_J3B_LE_FROBENIUS_DE_CARACTERISTIQUE_UN.pdf</title></a></g><g class="advanced-node demontre" id="map-ponts-IDE-066" data-map-node="jets"><a data-node="jets" href="../00_Carte_des_idees.html#node=IDE-066" aria-label="IDE-066 · Lemme des jets et relief"><rect class="node-bg" x="370" y="295" width="240" height="110" rx="6"/><text class="map-uid" x="384" y="316">IDE-066</text><text class="map-node-title" x="384" y="341">Jets : lemme et</text><text class="map-node-title" x="384" y="360">relief</text><text class="map-node-status" x="384" y="391">Démontré dans le dossier</text><title>Rang et jets donnent des contraintes précises ; une association numérique entre défaut et sortie ne prouve pas une causalité.</title></a><a class="map-pdf" data-pdf="jets" href="../1_Presentation/58_VALIDATION_DIRECTE_DU_RELIEF_ET_LEMME_DES_JETS.pdf" aria-label="PDF : Lemme des jets et relief"><rect x="561" y="303" width="38" height="21" rx="3"/><text x="580" y="318" text-anchor="middle">PDF</text><title>1_Presentation/58_VALIDATION_DIRECTE_DU_RELIEF_ET_LEMME_DES_JETS.pdf</title></a></g><g class="advanced-node obstacle" id="map-ponts-IDE-069" data-map-node="prime_norm"><a data-node="prime_norm" href="../00_Carte_des_idees.html#node=IDE-069" aria-label="IDE-069 · Norme de la partie première seule"><rect class="node-bg" x="45" y="510" width="240" height="110" rx="6"/><text class="map-uid" x="59" y="531">IDE-069</text><text class="map-node-title" x="59" y="556">Norme première</text><text class="map-node-title" x="59" y="575">divergente</text><text class="map-node-status" x="59" y="606">Obstruction circonscrite</text><title>La norme première sur L² diverge avant restriction ; elle ne peut pas remplacer le contrôle de la forme complète et de son domaine.</title></a><a class="map-pdf" data-pdf="prime_norm" href="../1_Presentation/66_UN_PLI_CERTIFIE_ET_SA_PAIRE.pdf" aria-label="PDF : Norme de la partie première seule"><rect x="236" y="518" width="38" height="21" rx="3"/><text x="255" y="533" text-anchor="middle">PDF</text><title>1_Presentation/66_UN_PLI_CERTIFIE_ET_SA_PAIRE.pdf</title></a></g><g class="advanced-node demontre" id="map-ponts-IDE-043" data-map-node="v13"><a data-node="v13" href="../00_Carte_des_idees.html#node=IDE-043" aria-label="IDE-043 · Fibres, jets et pli choisi"><rect class="node-bg" x="370" y="510" width="240" height="110" rx="6"/><text class="map-uid" x="384" y="531">IDE-043</text><text class="map-node-title" x="384" y="556">Fibres, jets et pli</text><text class="map-node-title" x="384" y="575">choisi</text><text class="map-node-status" x="384" y="606">Démontré dans le dossier</text><title>Un pli et sa paire sont certifiés dans une boîte ; un coefficient A complexe arbitraire reste un autre problème.</title></a><a class="map-pdf" data-pdf="v13" href="../1_Presentation/65_FIBRES_PLIS_ET_POSITIVITE.pdf" aria-label="PDF : Fibres, jets et pli choisi"><rect x="561" y="518" width="38" height="21" rx="3"/><text x="580" y="533" text-anchor="middle">PDF</text><title>1_Presentation/65_FIBRES_PLIS_ET_POSITIVITE.pdf</title></a></g><g class="advanced-node demontre" id="map-ponts-IDE-067" data-map-node="dh_cert"><a data-node="dh_cert" href="../00_Carte_des_idees.html#node=IDE-067" aria-label="IDE-067 · Certificat négatif de DH"><rect class="node-bg" x="695" y="510" width="240" height="110" rx="6"/><text class="map-uid" x="709" y="531">IDE-067</text><text class="map-node-title" x="709" y="556">Témoin négatif de DH</text><text class="map-node-status" x="709" y="606">Démontré dans le dossier</text><title>Au moins 25 directions négatives dans une fenêtre, sous le budget d’erreur du dossier ; ce n’est pas un compte exact de tous les zéros.</title></a><a class="map-pdf" data-pdf="dh_cert" href="../1_Presentation/60_ARTICLES_ET_CERTIFICAT_DE_NEGATIVITE.pdf" aria-label="PDF : Certificat négatif de DH"><rect x="886" y="518" width="38" height="21" rx="3"/><text x="905" y="533" text-anchor="middle">PDF</text><title>1_Presentation/60_ARTICLES_ET_CERTIFICAT_DE_NEGATIVITE.pdf</title></a></g><g class="advanced-node demontre" id="map-ponts-IDE-044" data-map-node="domaines"><a data-node="domaines" href="../00_Carte_des_idees.html#node=IDE-044" aria-label="IDE-044 · P, moments et domaines"><rect class="node-bg" x="45" y="735" width="240" height="110" rx="6"/><text class="map-uid" x="59" y="756">IDE-044</text><text class="map-node-title" x="59" y="781">P, moments et</text><text class="map-node-title" x="59" y="800">domaines</text><text class="map-node-status" x="59" y="831">Démontré dans le dossier</text><title>P = ∂² − 1/4 construit les tests ; transports, cœur et parité sont établis sous leurs gardes.</title></a><a class="map-pdf" data-pdf="domaines" href="../1_Presentation/67_CONSTRUIRE_DES_PONTS_AVEC_BELLMAN.pdf" aria-label="PDF : P, moments et domaines"><rect x="236" y="743" width="38" height="21" rx="3"/><text x="255" y="758" text-anchor="middle">PDF</text><title>1_Presentation/67_CONSTRUIRE_DES_PONTS_AVEC_BELLMAN.pdf</title></a></g><g class="advanced-node partiel" id="map-ponts-IDE-047" data-map-node="schur"><a data-node="schur" href="../00_Carte_des_idees.html#node=IDE-047" aria-label="IDE-047 · Dette des couplages"><rect class="node-bg" x="695" y="735" width="240" height="110" rx="6"/><text class="map-uid" x="709" y="756">IDE-047</text><text class="map-node-title" x="709" y="781">Dette des couplages</text><text class="map-node-status" x="709" y="831">Acquis partiel</text><title>Schur et ses gardes restent acquis. Réanalyse finie V644 : dette relative 4+4 proche de1 à S=3 ; aucune queue infinie supplémentaire certifiée. Le document73 conserve son certificat complet distinct.</title></a><a class="map-pdf" data-pdf="schur" href="../1_Presentation/67_CONSTRUIRE_DES_PONTS_AVEC_BELLMAN.pdf" aria-label="PDF : Dette des couplages"><rect x="886" y="743" width="38" height="21" rx="3"/><text x="905" y="758" text-anchor="middle">PDF</text><title>1_Presentation/67_CONSTRUIRE_DES_PONTS_AVEC_BELLMAN.pdf</title></a></g><g class="advanced-node ouvert" id="map-ponts-IDE-051" data-map-node="global_sign"><a data-node="global_sign" href="../00_Carte_des_idees.html#node=IDE-051" aria-label="IDE-051 · Loi de signe de la famille"><rect class="node-bg" x="370" y="1010" width="240" height="110" rx="6"/><text class="map-uid" x="384" y="1031">IDE-051</text><text class="map-node-title" x="384" y="1056">Loi de signe globale</text><text class="map-node-status" x="384" y="1106">Obligation ouverte</text><title>Ouvert. Les modules de coefficients et observations diagonales perdent de fortes compensations dans les matrices V644. Le certificat adaptatif contrôle une fenêtre scalaire finie, sans loi arithmétique universelle.</title></a><a class="map-pdf" data-pdf="global_sign" href="../1_Presentation/76_RECONSTRUIRE_LA_PISTE_GLOBALE_DE_WEIL.pdf" aria-label="PDF : Loi de signe de la famille"><rect x="561" y="1018" width="38" height="21" rx="3"/><text x="580" y="1033" text-anchor="middle">PDF</text><title>1_Presentation/76_RECONSTRUIRE_LA_PISTE_GLOBALE_DE_WEIL.pdf</title></a></g></svg>