d="url(#advanced-arrow-weil)"><title>Réserve et résidu pour toutes les lignes</title></path><path class="advanced-edge known" data-edge-kind="equivalence" data-source="weil_all" data-target="RH" d="M490,1120 L490,1230" marker-end="url(#advanced-arrow-weil)"><title>Critère de Weil, domaine précisé</title></path><path class="advanced-edge known" data-edge-kind="relation" data-source="identity" data-target="fluctuation" d="M815,185 L815,290" marker-end="url(#advanced-arrow-weil)"><title>Deux descriptions des vrais poids</title></path><path class="advanced-edge limited" data-edge-kind="obstruction" data-source="prime_norm" data-target="domaines" d="M285,130 L370,130" marker-end="url(#advanced-arrow-weil)"><title>Contrôler la forme complète dans le domaine requis</title></path><path class="advanced-edge limited" data-edge-kind="obstruction" data-source="prime_norm" data-target="schur" d="M165,185 L165,200 L30,200 L30,495 L165,495 L165,510" marker-end="url(#advanced-arrow-weil)"><title>Ne pas payer le couplage par une norme divergente</title></path><path class="advanced-edge open" data-edge-kind="conditionnel" data-source="global_sign" data-target="@weil" d="M490,850 L490,905 L597,905 L597,920" marker-end="url(#advanced-arrow-weil)"><title>Signe ET couverture ; ET : global_sign, coverage</title></path><path class="advanced-edge open" data-edge-kind="conditionnel" data-source="coverage" data-target="@weil" d="M815,850 L815,905 L597,905 L597,920" marker-end="url(#advanced-arrow-weil)"><title>Signe ET couverture ; ET : global_sign, coverage</title></path><path class="advanced-edge open" data-edge-kind="conditionnel" data-source="@weil" data-target="weil_all" d="M597,958 L597,995 L490,995 L490,1010" marker-end="url(#advanced-arrow-weil)"><title>Signe ET couverture ; ET : global_sign, coverage</title></path><g class="advanced-node obstacle" id="map-weil-IDE-069" data-map-node="prime_norm"><a data-node="prime_norm" href="../00_Carte_des_idees.html#node=IDE-069" aria-label="IDE-069 · Norme de la partie première seule"><rect class="node-bg" x="45" y="75" width="240" height="110" rx="6"/><text class="map-uid" x="59" y="96">IDE-069</text><text class="map-node-title" x="59" y="121">Norme première</text><text class="map-node-title" x="59" y="140">divergente</text><text class="map-node-status" x="59" y="171">Obstruction circonscrite</text><title>La norme première sur L² diverge avant restriction ; elle ne peut pas remplacer le contrôle de la forme complète et de son domaine.</title></a><a class="map-pdf" data-pdf="prime_norm" href="../1_Presentation/66_UN_PLI_CERTIFIE_ET_SA_PAIRE.pdf" aria-label="PDF : Norme de la partie première seule"><rect x="236" y="83" width="38" height="21" rx="3"/><text x="255" y="98" text-anchor="middle">PDF</text><title>1_Presentation/66_UN_PLI_CERTIFIE_ET_SA_PAIRE.pdf</title></a></g><g class="advanced-node demontre" id="map-weil-IDE-044" data-map-node="domaines"><a data-node="domaines" href="../00_Carte_des_idees.html#node=IDE-044" aria-label="IDE-044 · P, moments et domaines"><rect class="node-bg" x="370" y="75" width="240" height="110" rx="6"/><text class="map-uid" x="384" y="96">IDE-044</text><text class="map-node-title" x="384" y="121">P, moments et</text><text class="map-node-title" x="384" y="140">domaines</text><text class="map-node-status" x="384" y="171">Démontré dans le dossier</text><title>P = ∂² − 1/4 construit les tests ; transports, cœur et parité sont établis sous leurs gardes.</title></a><a class="map-pdf" data-pdf="domaines" href="../1_Presentation/67_CONSTRUIRE_DES_PONTS_AVEC_BELLMAN.pdf" aria-label="PDF : P, moments et domaines"><rect x="561" y="83" width="38" height="21" rx="3"/><text x="580" y="98" text-anchor="middle">PDF</text><title>1_Presentation/67_CONSTRUIRE_DES_PONTS_AVEC_BELLMAN.pdf</title></a></g><g class="advanced-node classique" id="map-weil-IDE-054" data-map-node="identity"><a data-node="identity" href="../00_Carte_des_idees.html#node=IDE-054" aria-label="IDE-054 · Identité des vrais coefficients"><rect class="node-bg" x="695" y="75" width="240" height="110" rx="6"/><text class="map-uid" x="709" y="96">IDE-054</text><text class="map-node-title" x="709" y="121">Identité des poids</text><text class="map-node-title" x="709" y="140">premiers</text><text class="map-node-status" x="709" y="171">Critère / résultat classique</text><title>Σ_{d|n} Λ(d) = log n caractérise les poids arithmétiques ; elle ne donne pas, seule, une borne globale.</title></a><a class="map-pdf" data-pdf="identity" href="../1_Presentation/CORRELATIONS_IDENTITE_ET_ENERGIE.pdf" aria-label="PDF : Identité des vrais coefficients"><rect x="886" y="83" width="38" height="21" rx="3"/><text x="905" y="98" text-anchor="middle">PDF</text><title>1_Presentation/CORRELATIONS_IDENTITE_ET_ENERGIE.pdf</title></a></g><g class="advanced-node demontre" id="map-weil-IDE-045" data-map-node="compact"><a data-node="compact" href="../00_Carte_des_idees.html#node=IDE-045" aria-label="IDE-045 · Changement de métrique"><rect class="node-bg" x="45" y="290" width="240" height="110" rx="6"/><text class="map-uid" x="59" y="311">IDE-045</text><text class="map-node-title" x="59" y="336">Métrique et queue</text><text class="map-node-title" x="59" y="355">effective</text><text class="map-node-status" x="59" y="386">Démontré dans le dossier</text><title>Compact en H¹ : pas de marge strictement positive uniforme ; identité moins compact dans la métrique d’énergie déclarée.</title></a><a class="map-pdf" data-pdf="compact" href="../1_Presentation/68_ARITHMETIQUE_DES_PASSAGES_ET_QUEUE_EFFECTIVE.pdf" aria-label="PDF : Changement de métrique"><rect x="236" y="298" width="38" height="21" rx="3"/><text x="255" y="313" text-anchor="middle">PDF</text><title>1_Presentation/68_ARITHMETIQUE_DES_PASSAGES_ET_QUEUE_EFFECTIVE.pdf</title></a></g><g class="advanced-node demontre" id="map-weil-IDE-046" data-map-node="fluctuation"><a data-node="fluctuation" href="../00_Carte_des_idees.html#node=IDE-046" aria-label="IDE-046 · Fluctuation arithmétique signée"><rect class="node-bg" x="695" y="290" width="240" height="110" rx="6"/><text class="map-uid" x="709" y="311">IDE-046</text><text class="map-node-title" x="709" y="336">Fluctuation</text><text class="map-node-title" x="709" y="355">arithmétique</text><text class="map-node-status" x="709" y="386">Démontré dans le dossier</text><title>Annulation polaire et décomposition exacte : le modèle continu seul peut être négatif ; la fluctuation doit payer le bilan.</title></a><a class="map-pdf" data-pdf="fluctuation" href="../1_Presentation/70_PONT_ARITHMETIQUE_ET_DETTE_DE_COUPLAGE.pdf" aria-label="PDF : Fluctuation arithmétique signée"><rect x="886" y="298" width="38" height="21" rx="3"/><text x="905" y="313" text-anchor="middle">PDF</text><title>1_Presentation/70_PONT_ARITHMETIQUE_ET_DETTE_DE_COUPLAGE.pdf</title></a></g><g class="advanced-node partiel" id="map-weil-IDE-047" data-map-node="schur"><a data-node="schur" href="../00_Carte_des_idees.html#node=IDE-047" aria-label="IDE-047 · Dette des couplages"><rect class="node-bg" x="45" y="510" width="240" height="110" rx="6"/><text class="map-uid" x="59" y="531">IDE-047</text><text class="map-node-title" x="59" y="556">Dette des couplages</text><text class="map-node-status" x="59" y="606">Acquis partiel</text><title>Schur et ses gardes restent acquis. Réanalyse finie V644 : dette relative 4+4 proche de1 à S=3 ; aucune queue infinie supplémentaire certifiée. Le document73 conserve son certificat complet distinct.</title></a><a class="map-pdf" data-pdf="schur" href="../1_Presentation/67_CONSTRUIRE_DES_PONTS_AVEC_BELLMAN.pdf" aria-label="PDF : Dette des couplages"><rect x="236" y="518" width="38" height="21" rx="3"/><text x="255" y="533" text-anchor="middle">PDF</text><title>1_Presentation/67_CONSTRUIRE_DES_PONTS_AVEC_BELLMAN.pdf</title></a></g><g class="advanced-node demontre" id="map-weil-IDE-048" data-map-node="local"><a data-node="local" href="../00_Carte_des_idees.html#node=IDE-048" aria-label="IDE-048 · Lego local : S ≤ 11/20"><rect class="node-bg" x="370" y="510" width="240" height="110" rx="6"/><text class="map-uid" x="384" y="531">IDE-048</text><text class="map-node-title" x="384" y="556">Certificat local S ≤</text><text class="map-node-title" x="384" y="575">11/20</text><text class="map-node-status" x="384" y="606">Démontré dans le dossier</text><title>Certificat du dossier sur tous les tests du support borné déclaré ; conservé, sans promotion à tous supports.</title></a><a class="map-pdf" data-pdf="local" href="../1_Presentation/75_RECUPERATION_TRANSPORT_ET_RH.pdf" aria-label="PDF : Lego local : S ≤ 11/20"><rect x="561" y="518" width="38" height="21" rx="3"/><text x="580" y="533" text-anchor="middle">PDF</text><title>1_Presentation/75_RECUPERATION_TRANSPORT_ET_RH.pdf</title></a></g><g class="advanced-node partiel" id="map-weil-IDE-049" data-map-node="transport"><a data-node="transport" href="../00_Carte_des_idees.html#node=IDE-049" aria-label="IDE-049 · Transport et réserve"><rect class="node-bg" x="695" y="510" width="240" height="110" rx="6"/><text class="map-uid" x="709" y="531">IDE-049</text><text class="map-node-title" x="709" y="556">Transport et réserve</text><text class="map-node-status" x="709" y="606">Acquis partiel</text><title>Transport exact, grammaires et brique initiale acquis ; l’existence de toutes les lignes positives reste ouverte.</title></a><a class="map-pdf" data-pdf="transport" href="../1_Presentation/76_RECONSTRUIRE_LA_PISTE_GLOBALE_DE_WEIL.pdf" aria-label="PDF : Transport et réserve"><rect x="886" y="518" width="38" height="21" rx="3"/><text x="905" y="533" text-anchor="middle">PDF</text><title>1_Presentation/76_RECONSTRUIRE_LA_PISTE_GLOBALE_DE_WEIL.pdf</title></a></g><g class="advanced-node ouvert" id="map-weil-IDE-051" data-map-node="global_sign"><a data-node="global_sign" href="../00_Carte_des_idees.html#node=IDE-051" aria-label="IDE-051 · Loi de signe de la famille"><rect class="node-bg" x="370" y="740" width="240" height="110" rx="6"/><text class="map-uid" x="384" y="761">IDE-051</text><text class="map-node-title" x="384" y="786">Loi de signe globale</text><text class="map-node-status" x="384" y="836">Obligation ouverte</text><title>Ouvert. Les modules de coefficients et observations diagonales perdent de fortes compensations dans les matrices V644. Le certificat adaptatif contrôle une fenêtre scalaire finie, sans loi arithmétique universelle.</title></a><a class="map-pdf" data-pdf="global_sign" href="../1_Presentation/76_RECONSTRUIRE_LA_PISTE_GLOBALE_DE_WEIL.pdf" aria-label="PDF : Loi de signe de la famille"><rect x="561" y="748" width="38" height="21" rx="3"/><text x="580" y="763" text-anchor="middle">PDF</text><title>1_Presentation/76_RECONSTRUIRE_LA_PISTE_GLOBALE_DE_WEIL.pdf</title></a></g><g class="advanced-node partiel" id="map-weil-IDE-050" data-map-node="coverage"><a data-node="coverage" href="../00_Carte_des_idees.html#node=IDE-050" aria-label="IDE-050 · Couverture et passage à la limite"><rect class="node-bg" x="695" y="740" width="240" height="110" rx="6"/><text class="map-uid" x="709" y="761">IDE-050</text><text class="map-node-title" x="709" y="786">Couverture et limite</text><text class="map-node-status" x="709" y="836">Acquis partiel</text><title>Couvertures du corpus conservées. Nouvelle exécution : 44 cellules certifient le signal scalaire entre log2 et log1000 ; ce domaine était déjà traité dans79 et ne correspond pas à tous les tests de Weil.</title></a><a class="map-pdf" data-pdf="coverage" href="../1_Presentation/76_RECONSTRUIRE_LA_PISTE_GLOBALE_DE_WEIL.pdf" aria-label="PDF : Couverture et passage à la limite"><rect x="886" y="748" width="38" height="21" rx="3"/><text x="905" y="763" text-anchor="middle">PDF</text><title>1_Presentation/76_RECONSTRUIRE_LA_PISTE_GLOBALE_DE_WEIL.pdf</title></a></g><g class="advanced-node ouvert" id="map-weil-IDE-052" data-map-node="weil_all"><a data-node="weil_all" href="../00_Carte_des_idees.html#node=IDE-052" aria-label="IDE-052 · Weil sur tous les tests"><rect class="node-bg" x="370" y="1010" width="240" height="110" rx="6"/><text class="map-uid" x="384" y="1031">IDE-052</text><text class="map-node-title" x="384" y="1056">Weil sur tous les</text><text class="map-node-title" x="384" y="1075">tests</text><text class="map-node-status" x="384" y="1106">Obligation ouverte</text><title>Ouvert. Le document73 certifie déjà un domaine fonctionnel entier à petit support. Les nouveaux diagnostics de matrices et cellules scalaires ne prolongent pas cette portée à tous les supports.</title></a><a class="map-pdf" data-pdf="weil_all" href="../1_Presentation/76_RECONSTRUIRE_LA_PISTE_GLOBALE_DE_WEIL.pdf" aria-label="PDF : Weil sur tous les tests"><rect x="561" y="1018" width="38" height="21" rx="3"/><text x="580" y="1033" text-anchor="middle">PDF</text><title>1_Presentation/76_RECONSTRUIRE_LA_PISTE_GLOBALE_DE_WEIL.pdf</title></a></g><g class="advanced-node ouvert" id="map-weil-IDE-053" data-map-node="RH"><a data-node="RH" href="../00_Carte_des_idees.html#node=IDE-053" aria-label="IDE-053 · Hypothèse de Riemann"><rect class="node-bg" x="370" y="1230" width="240" height="110" rx="6"/><text class="map-uid" x="384" y="1251">IDE-053</text><text class="map-node-title" x="384" y="1276">Hypothèse de Riemann</text><text class="map-node-status" x="384" y="1326">Obligation ouverte</text><title>But inchangé : tous les zéros non triviaux sur Re(s)=1/2. Non démontré.</title></a><a class="map-pdf" data-pdf="RH" href="../1_Presentation/76_RECONSTRUIRE_LA_PISTE_GLOBALE_DE_WEIL.pdf" aria-label="PDF : Hypothèse de Riemann"><rect x="561" y="1238" width="38" height="21" rx="3"/><text x="580" y="1253" text-anchor="middle">PDF</text><title>1_Presentation/76_RECONSTRUIRE_LA_PISTE_GLOBALE_DE_WEIL.pdf</title></a></g><g class="and-gate" data-and-guard="global_sign coverage"><rect x="565" y="920" width="64" height="38" rx="19"/><text x="597" y="945" text-anchor="middle">ET</text><title>Signe ET couverture</title></g></svg>